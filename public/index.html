<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaianoBet - Bolão de Apostas</title>
  <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
  <style>
    :root {
      --verde:   #009C3B;
      --amarelo: #FFDF00;
      --azul:    #002776;
      --branco:  #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(150deg, var(--azul) 0%, #014a1a 60%, var(--verde) 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    .header { text-align: center; color: var(--branco); margin-bottom: 30px; }
    .header h1 { font-family: 'Ultra', serif; font-size: 52px; letter-spacing: 2px; color: var(--amarelo); text-shadow: 3px 3px 0px var(--azul), 0 0 20px rgba(255,223,0,0.4); margin-bottom: 10px; }
    .header-logo { width: 90px; height: 90px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
    .card { background: var(--branco); border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input, select, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--verde); }
    button { background: linear-gradient(135deg, var(--verde) 0%, #007a2f 100%); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,156,59,0.4); }
    .btn-secondary { background: #f0f0f0; color: #333; margin-left: 10px; }
    .btn-secondary:hover { background: #e0e0e0; box-shadow: none; }
    .btn-danger { background: #e03131; }
    .btn-danger:hover { background: #c92a2a; box-shadow: 0 4px 15px rgba(224,49,49,0.4); }
    .games-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .game-card { background: var(--branco); border-radius: 12px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); cursor: pointer; transition: all 0.3s; border-top: 4px solid var(--verde); }
    .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .game-title { font-size: 18px; font-weight: 700; color: var(--azul); margin-bottom: 10px; }
    .game-status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .status-open   { background: #d4edda; color: #155724; }
    .status-locked { background: #fff3cd; color: #856404; }
    .status-closed { background: #f8d7da; color: #721c24; }
    .section-title { font-size: 18px; font-weight: 700; margin: 20px 0 15px 0; color: #333; border-bottom: 3px solid var(--amarelo); padding-bottom: 10px; }
    .result-display { background: #f0fff4; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid var(--verde); }
    .error   { background: #f8d7da; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #e03131; }
    .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--verde); }
    .two-cols   { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .three-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .four-cols  { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; }
    .kpi-card { background: linear-gradient(135deg, var(--azul) 0%, #003fa3 100%); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--amarelo); }
    .kpi-value { font-size: 32px; font-weight: 700; margin: 10px 0; color: var(--amarelo); }
    .kpi-label { font-size: 14px; opacity: 0.9; }
    .leaderboard-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 15px; align-items: center; padding: 15px; border-bottom: 1px solid #e0e0e0; }
    .rank-badge { background: linear-gradient(135deg, var(--amarelo) 0%, #ffd000 100%); color: var(--azul); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .user-stats { background: #f9f9f9; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 4px solid var(--verde); }
    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e0e0e0; }
    .stat-label { font-weight: 600; color: #666; }
    .stat-value { color: var(--verde); font-weight: 700; }
    .bet-card { background: #f9f9f9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 4px solid var(--verde); }
    .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; flex-wrap: wrap; }
    .tab { padding: 10px 20px; border: none; background: none; cursor: pointer; font-weight: 600; color: #999; border-bottom: 3px solid transparent; }
    .tab.active { color: var(--verde); border-bottom-color: var(--amarelo); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.4); border-top: 5px solid var(--amarelo); }
    .modal-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; color: var(--azul); }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
    .modal-buttons button { flex: 1; }
    .mbway-box { background: linear-gradient(135deg, var(--verde), #005a1f); border-radius: 12px; padding: 20px; margin: 20px 0; color: white; text-align: center; }
    .mbway-logo { font-size: 32px; font-weight: 900; letter-spacing: 2px; color: var(--amarelo); margin-bottom: 4px; }
    .mbway-amount { font-size: 42px; font-weight: 900; color: var(--amarelo); margin: 12px 0; text-shadow: 2px 2px 0 rgba(0,0,0,0.3); }
    .mbway-contact { font-size: 18px; font-weight: 700; margin-top: 8px; }
    .mbway-number { font-size: 28px; font-weight: 900; letter-spacing: 3px; margin: 4px 0; }
    .mbway-ref { font-size: 13px; opacity: 0.85; margin-top: 10px; }
    .btn-copy { background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); color: white; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
    .btn-copy:hover { background: rgba(255,255,255,0.35); }
    .btn-mbway-confirm { background: var(--verde); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; transition: opacity 0.2s; }
    .btn-mbway-confirm:hover { opacity: 0.85; }
    .users-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    .users-table th { background: var(--azul); color: white; padding: 10px 12px; text-align: left; font-weight: 600; }
    .users-table td { padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .users-table tr:hover td { background: #f7f9ff; }
    .badge-pending { background: #ff6b35; color: white; border-radius: 10px; padding: 2px 7px; font-size: 11px; font-weight: 700; margin-left: 6px; }
    .badge-approved { background: var(--verde); color: white; border-radius: 10px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
    .badge-blocked { background: #999; color: white; border-radius: 10px; padding: 2px 7px; font-size: 11px; font-weight: 700; }
    .user-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .btn-xs { padding: 5px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; transition: opacity 0.2s; }
    .btn-xs:hover { opacity: 0.8; }
    .btn-xs-green { background: var(--verde); color: white; }
    .btn-xs-red { background: #e03131; color: white; }
    .btn-xs-yellow { background: var(--amarelo); color: var(--azul); }
    .btn-xs-gray { background: #aaa; color: white; }
    .btn-xs-blue { background: var(--azul); color: white; }
    .inline-pwd { display: flex; gap: 6px; margin-top: 6px; }
    .inline-pwd input { flex: 1; padding: 5px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    .pending-screen { text-align: center; padding: 60px 20px; }
    .pending-screen h2 { color: var(--amarelo); font-family: 'Ultra', serif; font-size: 28px; margin-bottom: 12px; }
    .pending-screen p { color: rgba(255,255,255,0.85); font-size: 16px; margin-bottom: 24px; }
    .winner-badge { background: linear-gradient(135deg, var(--amarelo) 0%, #ffd000 100%); color: var(--azul); padding: 12px 20px; border-radius: 8px; font-weight: 700; text-align: center; margin: 20px 0; font-size: 18px; border: 2px solid var(--verde); }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_URL = '/api';

    const PLAYERS = {
      brasil: ["Ninguém", "Alisson", "Ederson", "Weverton", "Alex Sandro", "Bremer", "Danilo", "Douglas Santos", "Gabriel Magalhães", "Ibañez", "Léo Pereira", "Marquinhos", "Wesley", "Bruno Guimarães", "Casemiro", "Danilo Santos", "Fabinho", "Lucas Paquetá", "Endrick", "Gabriel Martinelli", "Igor Thiago", "Luiz Henrique", "Matheus Cunha", "Neymar", "Raphinha", "Rayan", "Vini Jr."],
      marrocos: ["Ninguém", "Bounou", "El Kajoui", "Tagnaouti", "Mazraoui", "Salah-Eddine", "Belammari", "Hakimi", "El Ouahdi", "Aguerd", "Riad", "Halhal", "Diop", "El Mourabet", "Bouaddi", "El Aynaoui", "Amrabat", "Ounahi", "El Khannouss", "Saibari", "Ez Abde", "Talbi", "Rahimi", "El Kaabi", "Brahim Díaz", "Gessime", "Echghouyabe"],
      haiti: ["Ninguém", "Josue Duverger", "Alexandre Pierre", "Johny Placide", "Ricardo Ade", "Carlens Arcus", "Hannes Delcroix", "Jean-Kevin Duverne", "Martin Experience", "Duke Lacroix", "Wilguens Paugain", "Keeto Thermoncy", "Carl Fred Sainte", "Jean-Ricner Bellegarde", "Leverton Pierre", "Danley Jean Jacques", "Woodensky Pierre", "Dominique Simon", "Josue Casimir", "Louicius Deedson", "Derrick Etienne Jr.", "Yassin Fortune", "Wilson Isidor", "Lenny Joseph", "Duckens Nazon", "Frantzdy Pierrot", "Ruben Providence"],
      portugal: ["Ninguém", "Diogo Costa", "José Sá", "Rui Silva", "Ricardo Velho", "Diogo Dalot", "Matheus Nunes", "Nélson Semedo", "João Cancelo", "Nuno Mendes", "Gonçalo Inácio", "Renato Veiga", "Rúben Dias", "Tomás Araújo", "Rúben Neves", "Samuel Costa", "João Neves", "Vitinha", "Bruno Fernandes", "Bernardo Silva", "João Félix", "Francisco Trincão", "Francisco Conceição", "Pedro Neto", "Rafael Leão", "Gonçalo Guedes", "Gonçalo Ramos", "Cristiano Ronaldo"],
      uzbequistao: ["Ninguém", "Otkir Yusupov", "Abduvohid Nematov", "Botirali Ergashev", "Abdukodir Husanov", "Hojiakbar Alijonov", "Farruh Sayfiyev", "Rustam Ashurmatov", "Umar Eshmurodov", "Sherzod Nasrullayev", "Abdulla Abdullayev", "Avazbek Olmasaliyev", "Jahongir Orozov", "Behruz Karimov", "Akmal Mozgovoy", "Otabek Shukurov", "Jamshid Iskanderov", "Odil Hamrobekov", "Ruslanbek Jiyanov", "Oston O'runov", "Dostonbek Hamdamov", "Aziz G'aniyev", "Abbosbek Fayzullayev", "Sherzod Esanov", "Eldor Shomurodov", "Igor Sergeyev", "Azizbek Omonov"],
      escocia: ["Ninguém", "Craig Gordon", "Angus Gunn", "Liam Kelly", "Grant Hanley", "Jack Hendry", "Aaron Hickey", "Dom Hyam", "Scott McKenna", "Nathan Patterson", "Anthony Ralston", "Andy Robertson", "John Souttar", "Kieran Tierney", "Ryan Christie", "Findlay Curtis", "Lewis Ferguson", "Ben Doak", "Tyler Fletcher", "John McGinn", "Kenny McLean", "Scott McTominay", "Che Adams", "Lyndon Dykes", "George Hirst", "Lawrence Shankland", "Ross Stewart"],
      japao: ["Ninguém", "Zion Suzuki", "Keisuke Osako", "Tomoki Hayakawa", "Hiroki Ito", "Junnosuke Suzuki", "Ayumu Seko", "Shogo Taniguchi", "Tsuyoshi Watanabe", "Ko Itakura", "Takehiro Tomiyasu", "Yukinari Sugawara", "Yuto Nagatomo", "Daichi Kamada", "Ao Tanaka", "Kaishu Sano", "Shuto Machino", "Keito Nakamura", "Daizen Maeda", "Ritsu Doan", "Yuito Suzuki", "Junya Ito", "Ayase Ueda", "Koki Ogawa", "Kento Shiogai", "Keisuke Goto", "Takefusa Kubo"]
    };

    // Lookup dinâmico: normaliza nome do time e busca lista de jogadores
    const getPlayers = (teamName) => {
      if (!teamName) return ["Ninguém"];
      const key = teamName.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      const found = Object.keys(PLAYERS).find(k => key.includes(k) || k.includes(key));
      return found ? PLAYERS[found] : ["Ninguém"];
    };

    function BaianoBetApp() {
      const [token, setToken] = useState(localStorage.getItem('token'));
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('user') || 'null'));
      const [view, setView] = useState('games');
      const [games, setGames] = useState([]);
      const [selectedGame, setSelectedGame] = useState(null);
      const [gameDetails, setGameDetails] = useState(null);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [goalsA, setGoalsA] = useState(0);
      const [goalsB, setGoalsB] = useState(0);
      const [stats, setStats] = useState(null);
      const [leaderboard, setLeaderboard] = useState([]);
      const [userStats, setUserStats] = useState(null);
      const [confirmModal, setConfirmModal] = useState(null);
      const [mbwayModal, setMbwayModal] = useState(null);
      const [adminUsers, setAdminUsers] = useState([]);
      const [editPasswordId, setEditPasswordId] = useState(null);
      const [newPassword, setNewPassword] = useState('');
      const [editContactId, setEditContactId] = useState(null);
      const [contactEmail, setContactEmail] = useState('');
      const [contactPhone, setContactPhone] = useState('');
      const [showProfileBanner, setShowProfileBanner] = useState(true);
      const isAdmin = user?.is_admin || false;

      useEffect(() => {
        if (token) {
          fetchGames();
          if (isAdmin) fetchStats();
          fetchLeaderboard();
          fetchUserStats();
        }
      }, [token]);

      const fetchGames = async () => {
        try {
          const res = await fetch(`${API_URL}/games`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setGames(data);
        } catch (err) {
          setError('Erro ao carregar jogos');
        }
      };

      const fetchAdminUsers = async () => {
        try {
          const res = await fetch(`${API_URL}/admin/users`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setAdminUsers(Array.isArray(data) ? data : []);
        } catch (err) {
          console.error('Erro ao carregar utilizadores');
        }
      };

      const fetchStats = async () => {
        try {
          const res = await fetch(`${API_URL}/stats`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setStats(data);
        } catch (err) {
          console.error('Erro ao carregar stats');
        }
      };

      const fetchLeaderboard = async () => {
        try {
          const leaderRes = await fetch(`${API_URL}/leaderboard`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const leaderData = await leaderRes.json();
          setLeaderboard(leaderData);
        } catch (err) {
          console.error('Erro ao carregar leaderboard');
        }
      };

      const fetchUserStats = async () => {
        if (!user) return;
        try {
          const res = await fetch(`${API_URL}/user-stats/${user.id}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setUserStats(data);
        } catch (err) {
          console.error('Erro ao carregar user stats');
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: e.target.email.value,
              password: e.target.password.value
            })
          });
          const data = await res.json();
          if (data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            setToken(data.token);
            setUser(data.user);
            setSuccess('Login realizado! 🎉');
          } else {
            setError(data.error || 'Erro no login');
          }
        } catch (err) {
          setError('Erro ao conectar');
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: e.target.name.value,
              email: e.target.email.value,
              phone: e.target.phone.value,
              password: e.target.password.value
            })
          });
          const data = await res.json();
          if (data.token) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            setToken(data.token);
            setUser(data.user);
            setSuccess('Conta criada! Bem-vindo 🎉');
          } else {
            setError(data.error || 'Erro no registro');
          }
        } catch (err) {
          setError('Erro ao conectar');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        setToken(null);
        setUser(null);
        setSelectedGame(null);
        setGameDetails(null);
        setView('games');
      };

      const handleCreateGame = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_URL}/games`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              name: e.target.name.value,
              team_a: e.target.team_a.value,
              team_b: e.target.team_b.value,
              bet_value: e.target.bet_value.value,
              round: e.target.round?.value || null,
              lock_at: e.target.lock_at?.value || null
            })
          });
          const data = await res.json();
          if (data.id) {
            setSuccess('Jogo criado! ✅');
            e.target.reset();
            fetchGames();
            setView('games');
          } else {
            setError(data.error);
          }
        } catch (err) {
          setError('Erro ao criar jogo');
        }
      };

      const selectGame = async (gameId) => {
        try {
          const res = await fetch(`${API_URL}/games/${gameId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          setSelectedGame(gameId);
          setGameDetails(data);
          setView('game-detail');
          setGoalsA(0);
          setGoalsB(0);
        } catch (err) {
          setError('Erro ao carregar jogo');
        }
      };

      const handlePlaceBet = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const result_a = parseInt(formData.get('result_a'));
        const result_b = parseInt(formData.get('result_b'));

        let goals_a = [];
        for (let i = 0; i < result_a; i++) {
          const val = formData.get(`gol_a_${i}`);
          if (val) goals_a.push(val);
        }

        let goals_b = [];
        for (let i = 0; i < result_b; i++) {
          const val = formData.get(`gol_b_${i}`);
          if (val) goals_b.push(val);
        }

        try {
          const res = await fetch(`${API_URL}/games/${selectedGame}/bets`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              result_a,
              result_b,
              goals_team_a: goals_a.join(', '),
              goals_team_b: goals_b.join(', '),
              yellow_a: parseInt(formData.get('yellow_a')) || 0,
              red_a: parseInt(formData.get('red_a')) || 0,
              yellow_b: parseInt(formData.get('yellow_b')) || 0,
              red_b: parseInt(formData.get('red_b')) || 0
            })
          });
          const data = await res.json();
          if (data.id) {
            setSuccess('Aposta registrada! 🎯');
            e.target.reset();
            selectGame(selectedGame);
            setMbwayModal({
              value: parseFloat(gameDetails.game.bet_value || 0).toFixed(2),
              game: gameDetails.game.name
            });
          } else {
            setError(data.error);
          }
        } catch (err) {
          setError('Erro ao registrar aposta');
        }
      };

      const handleCloseGame = async (resultA, resultB, goalsA, goalsB, yellowA, redA, yellowB, redB) => {
        try {
          const res = await fetch(`${API_URL}/games/${selectedGame}/close`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
              result_a: resultA,
              result_b: resultB,
              goals_a: goalsA,
              goals_b: goalsB,
              yellow_a: yellowA,
              red_a: redA,
              yellow_b: yellowB,
              red_b: redB
            })
          });
          const data = await res.json();
          if (data.mainWinner) {
            setSuccess(`🎉 ${data.mainWinner.username} ganhou €${data.mainPrize.toFixed(2)}!`);
          } else {
            setSuccess('Jogo fechado! Nenhum vencedor para o prêmio principal.');
          }
          setConfirmModal(null);
          fetchGames();
          selectGame(selectedGame);
        } catch (err) {
          setError('Erro ao fechar jogo');
        }
      };

      const handleDeleteMyBet = async () => {
        if (!window.confirm('Apagar sua aposta? Você poderá fazer uma nova enquanto as apostas estiverem abertas.')) return;
        try {
          const res = await fetch(`${API_URL}/games/${selectedGame}/my-bet`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.ok) {
            setSuccess('Aposta apagada. Você pode fazer uma nova aposta.');
            selectGame(selectedGame);
          } else {
            setError(data.error);
          }
        } catch (err) {
          setError('Erro ao apagar aposta');
        }
      };

      const handleLockGame = async (gameId) => {
        try {
          const res = await fetch(`${API_URL}/games/${gameId}/lock`, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.ok) {
            setSuccess('Apostas bloqueadas 🔒');
            fetchGames();
            if (selectedGame === gameId) selectGame(gameId);
          } else {
            setError(data.error);
          }
        } catch (err) {
          setError('Erro ao bloquear apostas');
        }
      };

      const handleDeleteGame = async (gameId, gameName) => {
        if (!window.confirm(`Apagar "${gameName}"? Todas as apostas serão removidas.`)) return;
        try {
          const res = await fetch(`${API_URL}/games/${gameId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.ok) {
            setSuccess('Jogo apagado ✅');
            fetchGames();
          } else {
            setError(data.error);
          }
        } catch (err) {
          setError('Erro ao apagar jogo');
        }
      };

      const handleExportCSV = async () => {
        try {
          const res = await fetch(`${API_URL}/export-csv`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const csv = await res.text();
          const blob = new Blob([csv], { type: 'text/csv' });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'baianobetapp_apostas.csv';
          a.click();
          setSuccess('CSV exportado! ✅');
        } catch (err) {
          setError('Erro ao exportar CSV');
        }
      };

      const handleUpdateContact = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        try {
          const res = await fetch(`${API_URL}/profile/contact`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ email: formData.get('email'), phone: formData.get('phone') })
          });
          const data = await res.json();
          if (data.ok) {
            const updatedUser = { ...user, email: data.user.email, phone: data.user.phone };
            localStorage.setItem('user', JSON.stringify(updatedUser));
            setUser(updatedUser);
            setShowProfileBanner(false);
            setSuccess('Perfil atualizado! ✅');
          } else {
            setError(data.error);
          }
        } catch (err) {
          setError('Erro ao atualizar perfil');
        }
      };

            <div className="header">
              <img src="/logo.png" className="header-logo" alt="BaianoBet" />
              <h1>BaianoBet</h1>
              <p style={{ color: 'rgba(255,255,255,0.85)', fontSize: 16 }}>Bolão de apostas — Copa do Mundo 2026</p>
            </div>

            <div style={{ maxWidth: 400, margin: '0 auto' }}>

                {success && <div className="success">{success}</div>}

                    <label>Email</label>
                    <input type="text" name="email" placeholder="teu@email.com" required />
                    <span style={{ fontSize: 11, color: '#999', marginTop: 4, display: 'block' }}>Contas antigas: usa o teu nome de utilizador</span>
                  </div>
                  <div className="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" required />
                  </div>
                  <button type="submit" style={{ width: '100%' }}>Entrar</button>

              </div>

                    <label>Nome</label>
                    <input type="text" name="name" placeholder="Como te chamam" required />
                  </div>
                  <div className="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="teu@email.com" required />
                  </div>
                  <div className="form-group">
                    <label>Telefone</label>
                    <input type="tel" name="phone" placeholder="+351 9XX XXX XXX" required />
                  </div>
                  <div className="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" required />
                  </div>
                  <button type="submit" style={{ width: '100%' }}>Registrar</button>
                </form>
              </div>
            </div>
          </div>
        );

      // Utilizador ainda não aprovado
      if (token && user && !user.approved && !user.is_admin) {

          <div className="container">
            <div className="header">
              <img src="/logo.png" className="header-logo" alt="BaianoBet" />

            </div>
            <div className="pending-screen">
              <div style={{ fontSize: 64, marginBottom: 16 }}>⏳</div>
              <h2>Conta Pendente</h2>
              <p>O teu registo foi recebido! O administrador vai aprovar a tua conta em breve.</p>
              <div style={{ background: 'rgba(255,255,255,0.12)', borderRadius: 12, padding: '16px 20px', marginBottom: 24, maxWidth: 360, margin: '0 auto 24px auto' }}>
                <p style={{ marginBottom: 8 }}>✅ Assim que aprovado, clica em <strong>Sair</strong> abaixo e volta a fazer login para acederes ao bolão.</p>
              </div>
              <button className="btn-secondary" onClick={handleLogout}>Sair</button>
            </div>
          </div>
        );
      }

      return (
        <div className="container">

            <img src="/logo.png" className="header-logo" alt="BaianoBet" />
            <h1>BaianoBet</h1>
            <p>Bem-vindo, <strong>{user.username}</strong>{isAdmin && <span style={{ marginLeft: 10, background: 'var(--amarelo)', color: 'var(--azul)', padding: '4px 12px', borderRadius: 4, fontWeight: 700, fontSize: 12 }}>👑 ADMIN</span>}</p>

                      <div className="stat-label">Ganhos</div>
                    </div>
                  </div>
                </div>

                        <div style={{ display: 'flex', gap: 8, marginTop: 15 }}>

                            selectGame(game.id);
                          }}>Ver Detalhes →</button>

                            <button style={{ padding: '12px 16px', background: '#f59e0b' }} onClick={(e) => {
                              e.stopPropagation();
                              handleLockGame(game.id);
                            }} title="Bloquear apostas">🔒</button>
                          )}
                          {isAdmin && (
                            <button className="btn-danger" style={{ padding: '12px 16px' }} onClick={(e) => {
                              e.stopPropagation();
                              handleDeleteGame(game.id, game.name);
                            }} title="Apagar jogo">🗑️</button>

              {isAdmin && (

                  <form onSubmit={handleCreateGame}>
                    <div className="form-group">
                      <label>Nome do Jogo</label>
                      <input type="text" name="name" placeholder="Copa 2026 - Final" required />
                    </div>
                    <div className="two-cols">
                      <div className="form-group">
                        <label>Time A</label>
                        <input type="text" name="team_a" placeholder="Brasil" required />
                      </div>
                      <div className="form-group">
                        <label>Time B</label>
                        <input type="text" name="team_b" placeholder="Marrocos" required />
                      </div>
                    </div>
                    <div className="two-cols">
                      <div className="form-group">
                        <label>Valor da Aposta (€ por participante)</label>
                        <input type="number" name="bet_value" step="0.50" placeholder="10" required />
                      </div>
                      <div className="form-group">
                        <label>Fase/Round (opcional)</label>
                        <input type="text" name="round" placeholder="Quartas de Final" />
                      </div>
                    </div>
                    <div className="form-group">
                      <label>🕐 Encerrar apostas automaticamente (opcional)</label>
                      <input type="datetime-local" name="lock_at" />
                    </div>
                    <button type="submit">Criar Jogo 🎯</button>
                  </form>
                </div>
              )}
            </>
          )}

          {view === 'leaderboard' && (
            <div className="card">
              <button onClick={() => setView('games')} className="btn-secondary">← Voltar</button>
              <h2 style={{ marginTop: 20, marginBottom: 20 }}>🏆 Leaderboard</h2>
              {leaderboard.length === 0 ? (
                <p>Sem dados ainda</p>
              ) : (
                leaderboard.map((player, idx) => (
                  <div key={player.id} className="leaderboard-item">
                    <div className="rank-badge">#{idx + 1}</div>
                    <div>
                      <div style={{ fontWeight: 600 }}>{player.username}</div>
                      <div style={{ fontSize: 12, color: '#999' }}>
                        {player.bets_made} apostas • {player.wins} vitórias • Taxa: {player.win_rate || 0}%
                      </div>

                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontWeight: 700, color: '#51cf66', fontSize: 18 }}>
                        €{parseFloat(player.total_won || 0).toFixed(2)}
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {view === 'my-stats' && (
            <div className="card">
              <button onClick={() => setView('games')} className="btn-secondary">← Voltar</button>
              <h2 style={{ marginTop: 20, marginBottom: 20 }}>📊 Suas Estatísticas</h2>
              {userStats ? (
                <div>
                  <div className="three-cols" style={{ marginBottom: 20 }}>
                    <div className="kpi-card">
                      <div className="kpi-label">Total de Apostas</div>
                      <div className="kpi-value">{userStats.total_bets || 0}</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-label">Vitórias</div>
                      <div className="kpi-value">{userStats.wins || 0}</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-label">Prêmios Ganhos</div>
                      <div className="kpi-value">€{parseFloat(userStats.total_prizes || 0).toFixed(2)}</div>
                    </div>
                  </div>
                  <div className="user-stats">
                    <div className="stat-row">
                      <span className="stat-label">Taxa de Acerto</span>
                      <span className="stat-value">
                        {userStats.total_bets > 0 ? ((userStats.wins / userStats.total_bets) * 100).toFixed(1) : 0}%
                      </span>
                    </div>
                    <div className="stat-row">
                      <span className="stat-label">Ganhos Totais</span>
                      <span className="stat-value">
                        €{parseFloat(userStats.total_prizes || 0).toFixed(2)}
                      </span>
                    </div>
                  </div>
                </div>
              ) : (
                <p>Carregando...</p>
              )}
            </div>
          )}

          {view === 'admin-dashboard' && isAdmin && (
            <div>
              <button onClick={() => setView('games')} className="btn-secondary">← Voltar</button>
              <div style={{ marginTop: 20 }}>
                <h2 style={{ marginBottom: 20 }}>⚙️ Dashboard Admin</h2>
                {stats && (
                  <div className="four-cols" style={{ marginBottom: 20 }}>

                      <div className="kpi-label">Total de Jogos</div>
                      <div className="kpi-value">{stats.total_games}</div>

                      <div className="kpi-label">Total Arrecadado</div>
                      <div className="kpi-value">€{parseFloat(stats.total_raised || 0).toFixed(2)}</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-label">Maior Prêmio</div>
                      <div className="kpi-value">€{parseFloat(stats.largest_prize || 0).toFixed(2)}</div>
                    </div>
                    <div className="kpi-card">
                      <div className="kpi-label">Total de Jogadores</div>
                      <div className="kpi-value">{stats.total_players}</div>
                    </div>
                  </div>

                      {stats.top_winner.username}

                    <div style={{ fontSize: 13, color: '#555' }}>Último critério. Procrastinar pode custar a vitória.</div>
                  </div>

                  <div style={{ textAlign: 'center', color: '#999', fontSize: 13, marginTop: 4 }}>Se ninguém acertou o placar exato, a classificação é por:</div>
                  {[
                    ['↔️', 'Mesma diferença de gols', 'Resultado 3x1 (diff=2): apostas como 2x0, 4x2 ou 5x3 entram neste grupo.'],
                    ['⚽', 'Gols do vencedor', 'Acertou que o Brasil ia marcar 3, mesmo que o adversário não fosse 1.'],
                    ['⚽', 'Gols do perdedor', 'Acertou que o adversário ia levar 1 gol, mesmo errando o do Brasil.'],
                    ['👟', 'Marcadores de gols', 'Desempate dentro do grupo mais próximo.'],
                    ['🟨', 'Cartões', 'Desempate por quantidade de cartões acertados.'],
                    ['⏱️', 'Quem apostou primeiro', 'No pior caso, vence o mais rápido do grupo.'],
                  ].map(([icon, title, desc]) => (
                    <div key={title} style={{ background: '#f9f9f9', border: '1px solid #e0e0e0', borderRadius: 8, padding: '12px 16px', paddingLeft: 28, borderLeft: '4px solid #ddd' }}>
                      <div style={{ fontWeight: 700, marginBottom: 4 }}>{icon} {title}</div>
                      <div style={{ fontSize: 13, color: '#555' }}>{desc}</div>
                    </div>
                  ))}
                </div>

                <div style={{ background: '#fffacd', border: '1px solid #ffd700', borderRadius: 8, padding: '12px 16px', marginTop: 16 }}>
                  <strong>⚠️ Sempre sai um vencedor</strong> — mesmo que todo mundo erre feio, alguém vai ganhar o prêmio.
                </div>
              </div>

              <div className="card">
                <h3 style={{ color: 'var(--verde)', marginBottom: 12 }}>💰 Prêmio</h3>
                <p><strong>95%</strong> do valor total arrecadado vai para o vencedor do bolão.</p>
                <p style={{ marginTop: 8 }}><strong>5%</strong> fica retido pela BaianoBet (taxa de administração).</p>
                <p style={{ marginTop: 8, color: '#555', fontSize: 13 }}>Exemplo: 10 pessoas apostam €5 → pote de €50 → vencedor leva <strong>€47,50</strong>.</p>
              </div>
            </div>
          )}

          {mbwayModal && (
            <div className="modal-overlay" onClick={() => setMbwayModal(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-title">💳 Pagamento MBWay</div>
                <p style={{ color: '#555', marginBottom: 4 }}>Aposta registrada! Faz a transferência para confirmar a tua participação. <strong>O administrador vai validar o pagamento antes de a aposta ser aceite.</strong></p>
                <div className="mbway-box">
                  <div className="mbway-logo">MB WAY</div>
                  <div className="mbway-amount">€{mbwayModal.value}</div>
                  <div className="mbway-contact">Bauer Macedo</div>
                  <div className="mbway-number">969 736 933</div>
                  <div className="mbway-ref">Referência: {mbwayModal.game}</div>
                  <button className="btn-copy" onClick={() => {
                    navigator.clipboard.writeText('969736933');
                    alert('Número copiado! 📋');
                  }}>📋 Copiar número</button>
                </div>
                <div style={{ background: '#fff3cd', border: '1px solid #ffc107', borderRadius: 8, padding: '10px 14px', marginTop: 12, fontSize: 13, color: '#856404' }}>
                  ⏳ A tua aposta ficará <strong>pendente</strong> até o administrador confirmar o pagamento.
                </div>
                <button className="btn-mbway-confirm" onClick={() => setMbwayModal(null)}>
                  ✅ Ok, já fiz a transferência!
                </button>
              </div>
            </div>
          )}

          {confirmModal && (
            <div className="modal-overlay">
              <div className="modal-content">
                <div className="modal-title">⚠️ Confirmar Fechamento</div>
                <p style={{ color: '#666', marginBottom: 20 }}>
                  Tem certeza que quer fechar este jogo? <strong>Esta ação não pode ser desfeita!</strong>
                </p>
                <div style={{ background: '#f9f9f9', padding: 15, borderRadius: 8, marginBottom: 20 }}>
                  <p style={{ marginBottom: 8 }}>
                    <strong>Resultado:</strong> {confirmModal.resultA} x {confirmModal.resultB}
                  </p>
                  {confirmModal.goalsA && <p style={{ fontSize: 13, marginBottom: 4 }}><strong>Gols {gameDetails.game.team_a}:</strong> {confirmModal.goalsA}</p>}
                  {confirmModal.goalsB && <p style={{ fontSize: 13, marginBottom: 4 }}><strong>Gols {gameDetails.game.team_b}:</strong> {confirmModal.goalsB}</p>}
                  <p style={{ marginBottom: 4, fontSize: 13, color: '#555' }}>
                    🟨 {gameDetails.game.team_a}: {confirmModal.yellowA} | 🟥 {confirmModal.redA} &nbsp;&nbsp;
                    🟨 {gameDetails.game.team_b}: {confirmModal.yellowB} | 🟥 {confirmModal.redB}
                  </p>
                </div>
                <div className="modal-buttons">
                  <button className="btn-secondary" onClick={() => setConfirmModal(null)}>
                    Cancelar
                  </button>
                  <button className="btn-danger" onClick={() => {
                    handleCloseGame(
                      confirmModal.resultA,
                      confirmModal.resultB,
                      confirmModal.goalsA,
                      confirmModal.goalsB,
                      confirmModal.yellowA,
                      confirmModal.redA,
                      confirmModal.yellowB,
                      confirmModal.redB
                    );
                  }}>
                    Confirmar Fechamento
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<BaianoBetApp />, document.getElementById('root'));
  </script>
</body>
</html>
